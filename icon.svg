<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#16130E"/>
  <!-- Gold grid lines -->
  <line x1="0" y1="128" x2="512" y2="128" stroke="#B8955A" stroke-width="1" opacity="0.15"/>
  <line x1="0" y1="256" x2="512" y2="256" stroke="#B8955A" stroke-width="1" opacity="0.15"/>
  <line x1="0" y1="384" x2="512" y2="384" stroke="#B8955A" stroke-width="1" opacity="0.15"/>
  <line x1="128" y1="0" x2="128" y2="512" stroke="#B8955A" stroke-width="1" opacity="0.15"/>
  <line x1="256" y1="0" x2="256" y2="512" stroke="#B8955A" stroke-width="1" opacity="0.15"/>
  <line x1="384" y1="0" x2="384" y2="512" stroke="#B8955A" stroke-width="1" opacity="0.15"/>
  <!-- House shape -->
  <path d="M256 110 L420 230 L420 420 L92 420 L92 230 Z" fill="none" stroke="#B8955A" stroke-width="8" stroke-linejoin="round"/>
  <!-- Door -->
  <rect x="210" y="300" width="92" height="120" rx="4" fill="none" stroke="#B8955A" stroke-width="7"/>
  <!-- Window left -->
  <rect x="128" y="270" width="58" height="58" rx="4" fill="none" stroke="#B8955A" stroke-width="6" opacity="0.7"/>
  <!-- Window right -->
  <rect x="326" y="270" width="58" height="58" rx="4" fill="none" stroke="#B8955A" stroke-width="6" opacity="0.7"/>
  <!-- Roof peak circle -->
  <circle cx="256" cy="200" r="18" fill="#B8955A" opacity="0.9"/>
  <!-- Gold accent line bottom -->
  <rect x="92" y="418" width="328" height="5" rx="2" fill="#B8955A" opacity="0.6"/>
  <!-- N F text -->
  <text x="256" y="490" font-family="Georgia,serif" font-size="36" font-weight="400" fill="#B8955A" text-anchor="middle" opacity="0.5" letter-spacing="8">NF</text>
</svg>
