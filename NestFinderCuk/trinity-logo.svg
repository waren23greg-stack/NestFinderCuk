<line x1="148" y1="238" x2="252" y2="238" stroke="#d4a96a" stroke-width="1.2" opacity="0.9"/>

<!-- Wordmark -->
<text x="200" y="278" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="400" letter-spacing="5" fill="#d4a96a">NESTFINDER</text>
<text x="200" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="400" letter-spacing="5" fill="#6a8ab0" opacity="0.85">T R I N I T Y · N A I R O B I</text>
<line x1="172" y1="310" x2="228" y2="310" stroke="#b8955a" stroke-width="0.5" opacity="0.5"/>
</svg>
