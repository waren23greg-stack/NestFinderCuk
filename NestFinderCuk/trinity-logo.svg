<!-- T crossbar = roof ridge -->
<line x1="168" y1="150" x2="232" y2="150" stroke="#d4a96a" stroke-width="3" stroke-linecap="round"/>
<!-- T stem = house center -->
<line x1="200" y1="150" x2="200" y2="205" stroke="#d4a96a" stroke-width="3" stroke-linecap="round"/>
<!-- Roof slopes -->
<line x1="168" y1="150" x2="156" y2="170" stroke="#d4a96a" stroke-width="2" stroke-linecap="round"/>
<line x1="232" y1="150" x2="244" y2="170" stroke="#d4a96a" stroke-width="2" stroke-linecap="round"/>
